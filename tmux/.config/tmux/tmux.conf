# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# History
set -g history-limit 50000

# Indexing
set -g base-index 1
setw -g pane-base-index 1

# Naming
set -g allow-rename off
setw -g automatic-rename off

# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ,xterm-256color:RGB

# Popups and panes
set -g popup-border-lines rounded
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour141"
set -g pane-border-status off
set -g display-panes-colour colour238
set -g display-panes-active-colour colour141

# Responsiveness
set -sg escape-time 10

# Reload
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display-message "tmux config reloaded"

# Help popup
bind H display-popup -E -w 90% -h 85% "tmux list-keys -N | less -R"

# Pickers
bind S display-popup -E -w 85% -h 70% "tmux list-sessions -F '#{session_name}' | fzf --reverse --prompt='session> ' | xargs -r tmux switch-client -t"
bind W display-popup -E -w 85% -h 70% "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' | fzf --reverse --prompt='window> ' | awk '{print \$1}' | xargs -r tmux switch-client -t"
bind P display-popup -E -w 90% -h 75% "tmux list-panes -a -F '#{pane_id} #{session_name}:#{window_index}.#{pane_index} #{pane_current_command} #{pane_current_path}' | fzf --reverse --prompt='pane> ' | awk '{print \$1}' | xargs -r tmux select-pane -t"
bind E choose-tree -Zw

# Named creation/rename
bind c display-popup -E -w 50% -h 9 "$HOME/.local/bin/tmux-name new-window"
bind C display-popup -E -w 50% -h 9 "$HOME/.local/bin/tmux-name new-session"
bind , display-popup -E -w 50% -h 9 "$HOME/.local/bin/tmux-name rename-window"
bind '$' display-popup -E -w 50% -h 9 "$HOME/.local/bin/tmux-name rename-session"

# Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Splits
bind | split-window -h
bind - split-window -v

# Mouse
set -g mouse on

# Copy-mode selection
set -g mode-style "fg=#000000,bg=#ffffff,bold"

# TPM plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Theme
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'left'
set -g @catppuccin_window_text "  #W"
set -g @catppuccin_window_current_text "  #W"
set -g @catppuccin_window_number '#I'
set -g @catppuccin_window_current_number '#I'
set -g @catppuccin_window_flags 'icon'
set -g @catppuccin_window_text_color '#{@thm_surface_0}'
set -g @catppuccin_window_number_color '#{@thm_surface_0}'
set -g @catppuccin_window_current_text_color '#{@thm_surface_1}'
set -g @catppuccin_window_current_number_color '#{@thm_surface_1}'
set -g @catppuccin_window_current_left_separator '#[fg=#{@_ctp_status_bg},reverse]#[none]'
set -g @catppuccin_window_current_middle_separator ' '
set -g @catppuccin_window_current_right_separator '#[fg=#{@_ctp_status_bg},reverse]#[none]'
set -g @catppuccin_pane_status_enabled 'no'
set -g @catppuccin_pane_border_style 'fg=#{@thm_surface_1}'
set -g @catppuccin_pane_active_border_style 'fg=#{@thm_mauve},bold'
set -g @catppuccin_pane_color '#{@thm_mauve}'
set -g @catppuccin_pane_background_color '#{@thm_surface_0}'
set -g @catppuccin_pane_default_text '#{?pane_active, ,}#{b:pane_current_path}'
set -g @catppuccin_pane_default_fill 'number'
set -g @catppuccin_pane_number_position 'left'
set -g @catppuccin_application_icon '  '
set -g @catppuccin_session_icon '  '

set -g status-position top
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_application}'
set -agF status-right '#{E:@catppuccin_status_cpu}'
set -agF status-right '#{E:@catppuccin_status_ram}'
set -ag status-right '#{E:@catppuccin_status_session}'
set -ag status-right '#{E:@catppuccin_status_uptime}'

bind T display-menu -T "Tmux theme" \
  "Mocha" m "set -g @catppuccin_flavor mocha \; set -g @catppuccin_reset true \; run-shell '$HOME/.local/share/tmux/plugins/tmux/catppuccin.tmux' \; display-message 'tmux theme: mocha'" \
  "Macchiato" c "set -g @catppuccin_flavor macchiato \; set -g @catppuccin_reset true \; run-shell '$HOME/.local/share/tmux/plugins/tmux/catppuccin.tmux' \; display-message 'tmux theme: macchiato'" \
  "Frappe" f "set -g @catppuccin_flavor frappe \; set -g @catppuccin_reset true \; run-shell '$HOME/.local/share/tmux/plugins/tmux/catppuccin.tmux' \; display-message 'tmux theme: frappe'" \
  "Latte" l "set -g @catppuccin_flavor latte \; set -g @catppuccin_reset true \; run-shell '$HOME/.local/share/tmux/plugins/tmux/catppuccin.tmux' \; display-message 'tmux theme: latte'"

# Resurrect
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh vim nvim lazygit'

# Continuum
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @continuum-restore-max-delay '60'

run "$HOME/.local/share/tmux/plugins/tpm/tpm"
